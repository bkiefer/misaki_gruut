[tool.hatch.metadata]
allow-direct-references = true

[project]
name = "misaki-gruut"
version = "0.9.4"
description = "G2P engine for TTS, European languages only, gruut instead of espeak-ng"
readme = "README.md"
authors = [
    { name = "hexgrad", email = "hello@hexgrad.com" }
]
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.10, <3.14"
dependencies = [
    "addict",
    "gruut>=2.4.0",
    "pip>=25.0.1", 
    # ^ Spacy needs pip within Python, uv lacks pip by default
    "regex",
]

[project.optional-dependencies]
en = ["num2words", "spacy<4", "spacy-curated-transformers", "torch", "transformers"]
# Other European languages are phonemized with gruut, see misaki_gruut/gruut.py
ca = ["gruut[ca]"]
cs = ["gruut[cs]"]
de = ["gruut[de]"]
es = ["gruut[es]"]
fr = ["gruut[fr]"]
it = ["gruut[it]"]
lb = ["gruut[lb]"]
nl = ["gruut[nl]"]
pt = ["gruut[pt]"]
ru = ["gruut[ru]"]
sv = ["gruut[sv]"]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
